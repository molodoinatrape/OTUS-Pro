[project]
name = "06-08-api-scoring"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "flake8>=7.4.1",
    "isort>=9.0.2",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.black]
line-length = 88
target-version = ["py314"]

[tool.isort]
profile = "black"

[tool.mypy]
python_version = "3.14"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
